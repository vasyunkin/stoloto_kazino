# Test profile overrides.
# Datasource URL is overridden by @ServiceConnection (Testcontainers) — no need to set it here.
game:
  admin:
    api-key: test-admin-key   # avoid "change-me-in-prod" confusion in tests
    jwt-secret: test-jwt-secret-must-be-at-least-32-bytes-long
    bootstrap-username: admin
    bootstrap-password: admin
    legacy-api-key-enabled: true
    allow-deposit: true

app:
  rate-limit:
    enabled: false            # flyingRound() may POST /start dozens of times
  ws:
    tick-interval-ms: 100
