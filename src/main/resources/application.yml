server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/plain

spring:
  application:
    name: balloon-game

  # ── Database ────────────────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/balloon_game}
    username: ${SPRING_DATASOURCE_USERNAME:balloon}
    password: ${SPRING_DATASOURCE_PASSWORD:balloon}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# ── Actuator ──────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ── OpenAPI (S9) ──────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

# ── CORS + rate limit (S9) ────────────────────────────────────────────────
app:
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "https://*.trycloudflare.com"
      - "https://*.cloudflaretunnel.com"
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:3000
      - http://127.0.0.1:5173
  rate-limit:
    enabled: true
    capacity: 40
    window-seconds: 10
  ws:
    tick-interval-ms: 200

# ── Game Configuration (runtime-configurable via PUT /api/admin/config) ──
game:
  # Altitude / Levels structure
  green-levels: 9             # Safe zone lines
  red-levels: 12              # Risk zone lines
  points-per-line: 10         # Base score points per line passed
  ascent-speed-lines-per-sec: 1.5

  scoring:
    red-zone-multiplier: 1.0  # RED zone line points vs GREEN (jury-tunable)

  # Crash Math: K(t) = e^(α·t) — α reduced ~1.5× vs original for slower climb
  math:
    growth-rate: 0.0433       # Default α (overridden per theme at round start)
    house-edge: 0.08          # 8% house edge
    instant-crash-rate: 0.08  # Chance of instant crash at 1.00x
    min-crash-point: 1.00     # Classic: can bust at 1.00
    min-cashout-multiplier: 1.01  # Cashout from 1.01x (no free +20% wait)

  # Theme profiles (merged into round snapshot on start)
  themes:
    standard:                 # Green balloon
      min-bet-amount: 12.0
      max-bet-amount: 5000.0
      growth-rate: 0.0367
      max-win-multiplier: 50.0
      green-levels: 9
      red-levels: 6
    lucky:                    # Red balloon
      min-bet-amount: 25.0
      max-bet-amount: 10000.0
      growth-rate: 0.0567
      max-win-multiplier: 100.0
      green-levels: 9
      red-levels: 12

  # Booster settings
  boosters:
    spawn-probability: 0.45
    line-bias-power: 2.0      # Higher → more low-line triggers
    tiers:
      - tier: 1
        name: "Standard Flame"
        multiplier: 1.5
        probability-weight: 50
      - tier: 2
        name: "Super Burner"
        multiplier: 2.0
        probability-weight: 35
      - tier: 3
        name: "Nitro Thruster"
        multiplier: 3.0
        probability-weight: 15

  # Admin & wallet limits (fallback; themes override min/max bet + maxWin)
  admin:
    api-key: ${GAME_ADMIN_KEY:change-me-in-prod}
    min-bet-amount: 10.0
    max-bet-amount: 10000.0
    min-win-amount: 50.0
    max-win-multiplier: 100.0
    allow-deposit: true       # Set false in prod; overridable via PUT /api/admin/config
    welcome-balance: 1000.0   # Auto-credit on first GET /balance (creates player)

  # Provably Fair
  provably-fair:
    server-seed-length-bytes: 32
    hash-algorithm: SHA-256
    # S15: set only under spring.profiles.active=dev|test (see application-dev.yml).
    # Never enable a fixed seed in production.
    # dev-fixed-server-seed:
